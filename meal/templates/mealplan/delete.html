{% extends "home/base.html" %}

{% block title %}Delete Meal Plan{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white shadow rounded-lg p-6">

    <h1 class="text-2xl font-bold text-red-600 mb-4">
        Delete Meal Plan
    </h1>

    <p class="mb-6 text-gray-700">
        Are you sure you want to delete the meal plan:
        <strong>{{ object.title }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <div class="flex gap-3">

            <button type="submit"
                class="bg-red-600 text-white px-5 py-2 rounded hover:bg-red-700">
                Delete
            </button>

            <a href="{% url "mealplan-list" %}"
                class="bg-gray-500 text-white px-5 py-2 rounded hover:bg-gray-600">
                Cancel
            </a>

        </div>

    </form>

</div>
{% endblock %}
