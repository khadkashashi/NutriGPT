{% extends "home/base.html" %}

{% block title %}Payment Processing{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="bg-white shadow-lg rounded-xl p-8 text-center max-w-md w-full">

        <div class="flex justify-center mb-6">
            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-2">
            Payment Processing
        </h2>

        <p class="text-gray-600 mb-4">
            Please wait while we redirect you to the payment gateway.
        </p>

        <p class="text-lg font-semibold">
            Redirecting in <span id="countdown">3</span> seconds...
        </p>

        <p class="text-sm text-gray-400 mt-4">
            Not redirected automatically?
            <a href="{{ payment }}" class="text-blue-600 underline">Click here</a>
        </p>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    let seconds = 3;
    const countdown = document.getElementById("countdown");
    const paymentUrl = "{{ payment|escapejs }}";

    const timer = setInterval(() => {
        seconds--;
        countdown.textContent = seconds;

        if (seconds <= 0) {
            clearInterval(timer);
            window.location.href = paymentUrl; // same-tab redirect — not blocked
        }
    }, 1000);
});
</script>
{% endblock %}
